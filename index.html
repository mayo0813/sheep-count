<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>양 세기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* VOICE: 자장가처럼 다정하다가, 다정함이 틀어지는 목소리
   IDEA: 90년대 일본 저예산 호러 게임 화면 — 액자 속 저해상도 밤
   PICTURE: 192px 캔버스를 키운 픽셀 화면, 디더링·그레인·스캔라인, 죽은 숲과 울타리
   COLOUR and TYPE: 1회차 청록 단색 램프, 2회차 세피아·녹, 깜놀은 흑백+피 / DotGothic16
   LAYOUT: 가운데 액자 화면, 왼쪽 위 HUD, 아래 대사창 */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:"DotGothic16",ui-monospace,monospace;color:#cfe0d8}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
#frame{position:relative;padding:10px;background:linear-gradient(135deg,#a9bcb8 0%,#5d7471 28%,#2b3a39 50%,#6f8784 76%,#b9cbc6 100%);box-shadow:inset 2px 2px 0 #dfe9e5,inset -2px -2px 0 #111a19,0 0 0 2px #000,0 0 50px rgba(70,120,110,.12)}
#frame canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid #050a0a}
body.p2 #frame{background:radial-gradient(circle at 50% 38%,#b0602e 0 2px,#5a2410 2.5px 3.5px,transparent 4px) 0 0/13px 13px,radial-gradient(#3a1608 0 1.6px,transparent 2px) 6.5px 6.5px/13px 13px,#1a0904;box-shadow:inset 0 0 0 2px #6a2a12,0 0 0 2px #000,0 0 50px rgba(140,40,10,.15)}
body.p2 #frame canvas{border-color:#8a1a10}
#out{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;image-rendering:pixelated;z-index:5}
#scr{position:fixed;left:0;top:0;width:100vw;height:100vh;image-rendering:pixelated;z-index:50;display:none;pointer-events:none}
#end .tag{margin-top:20px;font-size:13px;opacity:0;transition:opacity 2s;color:#a89c88}
#end.show2 .tag{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:15px;color:#e8efe8;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;pointer-events:none;display:none;animation:bl 1.2s steps(2) infinite}
body.p2 #hint{color:#f0c08a}
#hud{position:absolute;top:17px;left:19px;font-size:14px;color:#d8e4dc;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000;pointer-events:none;transition:opacity .6s}
#count{font-size:22px;margin-left:4px}
body.p2 #hud{color:#f0c08a}
#say{width:var(--vw,340px);max-width:calc(100vw - 24px);min-height:84px;padding:12px 14px;border:3px double #8fa6a0;background:#030707;color:#cfe0d8;font-size:17px;line-height:1.55;white-space:pre-wrap;pointer-events:none;transition:opacity .4s}
body.p2 #say{border-color:#9a4a22;color:#f0c08a;background:#0a0402}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ov.on{display:flex}
#title{background:#000}
#title h1{font-size:54px;margin:0 0 8px;font-weight:400;color:#dfe9e3;text-shadow:2px 2px 0 #1b3539;animation:fl 5s steps(1) infinite}
#title p{margin:6px 0;font-size:17px;color:#86a29a}
#title .hint{margin-top:36px;color:#cfe0d8;animation:bl 1.4s steps(2) infinite}
#title .again{font-size:14px;color:#4f6f6c;margin-top:18px}
@keyframes bl{50%{opacity:0}}
@keyframes fl{0%,93%,97%{opacity:1}95%{opacity:.3}}
#crash{background:rgba(0,0,0,.4)}
#crash .box{width:min(340px,92vw);background:#c8c8c8;color:#111;border:2px solid #fff;box-shadow:4px 4px 0 #000;text-align:left;font-family:system-ui,sans-serif}
#crash .bar{background:#1b2b6a;color:#fff;padding:6px 10px;font-size:14px}
#crash .msg{padding:18px 14px;font-size:15px;line-height:1.5}
#crash .btns{display:flex;gap:8px;justify-content:flex-end;padding:0 12px 12px}
#crash button{font:inherit;min-height:44px;padding:0 16px;border:2px solid #111;background:#eee;cursor:pointer}
#end{background:#000;color:#e8d8c0}
#end .big{font-size:64px;opacity:0;transition:opacity 2s}
#end .small{font-size:18px;line-height:1.7;margin-top:22px;opacity:0;transition:opacity 2s;white-space:pre-wrap}
#end button{margin-top:40px;min-height:44px;padding:0 18px;background:transparent;color:#e8d8c0;border:2px solid #e8d8c0;opacity:0;transition:opacity 2s;font:inherit;font-size:16px;cursor:pointer}
#end.show .big,#end.show2 .small,#end.show3 button{opacity:1}
@media (prefers-reduced-motion:reduce){#title .hint,#title h1{animation:none}}
</style>
</head>
<body>
<main id="wrap">
  <div id="frame"><canvas id="c"></canvas><div id="hint">화면을 꾹 눌러 눈 감기</div><div id="hud" style="opacity:0"><span id="label">센 양</span><span id="count">0</span></div></div>
  <div id="say" style="opacity:0"></div>
<canvas id="out"></canvas>
<canvas id="scr"></canvas>
</main>
<div id="title" class="ov on">
  <h1>양 세기</h1>
  <p>잠이 안 올 때</p>
  <p class="hint">화면을 눌러 시작</p>
  <p class="again" id="again"></p>
</div>
<div id="crash" class="ov"><div class="box">
  <div class="bar">양 세기</div>
  <div class="msg" id="cmsg"></div>
  <div class="btns"><button id="cb1">기다리기</button><button id="cb2">닫기</button></div>
</div></div>
<div id="end" class="ov">
  <div class="big">하나.</div>
  <div class="small"></div>
  <div class="tag" id="etag"></div>
  <button id="retry">다시 세기</button>
</div>
<script>
{
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d',{willReadFrequently:true});
const LW=192,R0=Math.random;
let LH=168,gy,fx,trees=[],specks=[],vig=null;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const CRASH_MSG="'양 세기'이(가) 응답하지 않습니다.<br>양이 너무 많습니다.";
$('cmsg').innerHTML=CRASH_MSG;

function layout(){
  const port=innerHeight>=innerWidth;LH=port?168:124;cv.width=LW;cv.height=LH;cx.imageSmoothingEnabled=false;
  const maxW=Math.min(innerWidth-48,760),maxH=innerHeight-240;let w=maxW;if(w*LH/LW>maxH)w=Math.max(220,maxH*LW/LH);
  cv.style.width=w+'px';cv.style.height=w*LH/LW+'px';document.body.style.setProperty('--vw',(w+24)+'px');
  gy=Math.round(LH*.72);fx=LW/2;
  trees=[];let x=-6;while(x<LW){const tw=5+R0()*9;if(!(x+tw>LW*.68&&x<LW*.92))trees.push({x,w:tw,l:(R0()-.5)*7,k:Array.from({length:3},()=>R0())});x+=tw+6+R0()*20}
  specks=Array.from({length:160},()=>({x:R0()*LW|0,y:gy+R0()*(LH-gy)|0,v:R0()<.5?10:62}));
  vig=new Float32Array(LW*LH);for(let y=0;y<LH;y++)for(let i=0;i<LW;i++){const dx=i/LW-.5,dy=y/LH-.5;vig[y*LW+i]=(1-(dx*dx+dy*dy)*1.1)*((y&1)?.88:1)}
}
addEventListener('resize',layout);layout();

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let visits=+(store.get('sheep_visits')||0);
if(visits>0)$('again').textContent='또 왔네요. 양들이 기억하고 있어요.';

let phase='title',count=0,sheep=[],floats=[],flags={},nextKind=null,reverseLeft=0,spawnT=0;
let moonEye=false,red=0,redT=0,dark=0,darkT=0,allStare=false,frozen=false,shake=0,lastTap=0,idleSaid=0,T=0,scareT=0,scareDur=1;
let ptr={x:LW/2,y:LH/2};
let forceClose=false,needSince=0,p1Nums=[],p2i=0,reflImg=null,reflKey='',wOn=false,wIdx=0;
let watch=0,needClose=0,holding=false,holdStart=0,eyeC=0,eyeT=0,closedT=0,hoofT=0,lostN=0,lostShow=[],fing=null,peekT=-1,edgeHands=false;
const stars=Array.from({length:26},()=>({x:R0(),y:R0()*.8,p:R0()*5}));
const fseed=Array.from({length:80},()=>({x:R0()*2-1,c:18+R0()*90|0,w:.6+R0()*1.3,s:(R0()-.5)*7,len:.6+R0()*.7}));
const BLOBS=[[0,0,1],[-.6,.1,.7],[.6,.1,.7],[-.3,-.45,.65],[.35,-.42,.65],[0,.35,.7],[-.75,-.2,.5],[.75,-.15,.5]];

/* ---------- 팔레트 / 후처리 ---------- */
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const P1=['#030607','#08141a','#0f2328','#1b3539','#2e4d4f','#4f6f6c','#86a29a','#c8d8cc','#eef3e8'].map(hex);
const P2=['#060201','#170803','#2c1206','#47200c','#683214','#8f4c22','#b97038','#dfa265','#f6d9a8'].map(hex);
const PG=['#000000','#0e0e0e','#1f1f1f','#363636','#525252','#767676','#9c9c9c','#c8c8c8','#f2f2ee'].map(hex);
const PK=['#000000','#12020a','#360618','#6a1030','#a83a58','#d8808e','#e8b4bc','#bfe6ea','#f4ffff'].map(hex);
const PR=['#120102','#3a0406','#6e0a0c','#a8161a','#d83a2a'].map(hex);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16-.5);
function post(){
  const img=cx.getImageData(0,0,LW,LH),d=img.data,n=8;
  const sc=false,ramp=sc?(R0()<.15?PK:PG):P1.map((c,i)=>c.map((v,j)=>v+(P2[i][j]-v)*red));
  const gA=sc?.26:.05+red*.05;
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){
    const p=y*LW+x,i=p*4,r=d[i],g=d[i+1],b=d[i+2],bd=BAY[(y&3)*4+(x&3)],gr=(R0()-.5)*gA,v=vig[p];
    let c;
    if(r>70&&r>g*2+20&&r>b*2+20){c=PR[clamp(Math.round((r/255*v+gr)*4+bd*.6),0,4)]}
    else{let L=(r*.3+g*.59+b*.11)/255;if(sc)L=(L-.4)*1.45+.4;c=ramp[clamp(Math.round((L*v+gr)*n+bd),0,n)]}
    d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];
  }
  cx.putImageData(img,0,0);
}

/* ---------- 소리 ---------- */
let ac=null,drone=null;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
function tone(f,d,type='sine',v=.07,det=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.value=f;o.detune.value=det;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.15){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*d|0,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(R0()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(ac.destination);s.start()}
function startDrone(){if(!ac||drone)return;const g=ac.createGain(),t=ac.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+5);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.connect(g);g.connect(ac.destination);const os=[55,58.2,82.9].map(f=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();return o});drone={g,os}}
function stopDrone(){if(!drone)return;const t=ac.currentTime;drone.g.gain.cancelScheduledValues(t);drone.g.gain.setValueAtTime(drone.g.gain.value,t);drone.g.gain.linearRampToValueAtTime(0,t+1.5);const os=drone.os;setTimeout(()=>os.forEach(o=>{try{o.stop()}catch(e){}}),1700);drone=null}

function hum(){return phase==='p1'?count/16*.35:phase==='ending'?1:.45+count/10*.55}
function bleat(h=0,vol=.11){if(!ac)return;const t=ac.currentTime,dur=.5+.45*h,f0=370-210*h;
  const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*1.04,t);o.frequency.linearRampToValueAtTime(f0*(1-.18*h),t+dur);
  const lf=ac.createOscillator(),lg=ac.createGain(),am=ac.createGain(),lg2=ac.createGain();lf.frequency.value=21-15*h;lg.gain.value=f0*.035*(1-h*.6);lg2.gain.value=.55*(1-h*.8);
  lf.connect(lg).connect(o.frequency);lf.connect(lg2).connect(am.gain);am.gain.value=1;
  const env=ac.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(vol,t+.05);
  if(h>.6){env.gain.linearRampToValueAtTime(vol*.15,t+dur*.32);env.gain.linearRampToValueAtTime(vol,t+dur*.45)}
  env.gain.setValueAtTime(vol,t+dur*.7);env.gain.exponentialRampToValueAtTime(.001,t+dur);
  const f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter(),mx=ac.createGain();f1.type=f2.type='bandpass';f1.frequency.value=620+120*h;f1.Q.value=4;f2.frequency.value=1850-760*h;f2.Q.value=6;mx.gain.value=1.8;
  o.connect(am);am.connect(f1);am.connect(f2);f1.connect(mx);f2.connect(mx);mx.connect(env).connect(ac.destination);
  o.start(t);lf.start(t);o.stop(t+dur+.05);lf.stop(t+dur+.05)}
function clop(){tone(150+R0()*50,.05,'square',.04);noise(.04,.1)}

/* ---------- 깜놀 ---------- */
function scare(d=.5){
  audio();scareT=scareDur=d;shake=d+.3;
  noise(d+.25,.5);tone(44,d+.5,'sawtooth',.32);tone(1380,d,'sawtooth',.13);tone(1466,d,'sawtooth',.13);tone(97,d+.3,'square',.15);
  try{navigator.vibrate&&navigator.vibrate([350])}catch(e){}
}
const NN=128,NZ=(()=>{const a=Array.from({length:NN*NN},R0),b=new Float32Array(NN*NN);for(let y=0;y<NN;y++)for(let x=0;x<NN;x++){let t=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)t+=a[((y+j+NN)%NN)*NN+(x+i+NN)%NN];b[y*NN+x]=t/9}return b})();
function nz(x,y){x=(x%NN+NN)%NN;y=(y%NN+NN)%NN;const x0=x|0,y0=y|0,fx_=x-x0,fy=y-y0,x1=(x0+1)%NN,y1=(y0+1)%NN,a=NZ[y0*NN+x0],b=NZ[y0*NN+x1],c=NZ[y1*NN+x0],d=NZ[y1*NN+x1];return a+(b-a)*fx_+(c-a)*fy+(a-b-c+d)*fx_*fy}
const fbm=(x,y)=>nz(x,y)*.5+nz(x*2.1+17,y*2.1)*.3+nz(x*4.3,y*4.3+31)*.2;
const GA=(u,v,a,b,sx,sy)=>{const p=(u-a)/sx,q=(v-b)/sy;return Math.exp(-(p*p+q*q))};
const smt=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t)};
function eyeShade(F,u,v,ex,ey,rx,ry,pr,n){
  const dx=(u-ex)/rx,dy=(v-ey)/ry,ed=dx*dx+dy*dy,sq=Math.sqrt(ed);
  F-=.32*Math.exp(-((sq-1.3)**2)/.08);F-=.6*Math.exp(-((sq-1.04)**2)/.014);
  if(ed<1){F=.66-.28*smt(.3,1,ed)+(n-.5)*.14-.38*smt(-.25,-1,dy)+.06*smt(.2,1,dy);
    const pp=Math.hypot((u-ex)/(rx*pr),(v-ey-ry*.08)/(rx*pr*.95))+(n-.5)*.08;if(pp<1)F=.02+.08*smt(.72,1,pp)}
  return F}
function gapeMouth(F,u,v,mx,my,mw,mh){
  const mt=(v-my)/mh,mc=mx+mw*.15*Math.sin(mt*2.2+.6),mwd=mw*(1-.32*smt(-.4,1,mt))*(u>mc?1.12:.9),px=(u-mc)/mwd;
  if(Math.abs(px)>2||mt<-1.6||mt>1.6)return F;
  const rad=Math.sqrt(px*px+(mt<0?Math.pow(Math.abs(mt),2.8):mt*mt)),ang=Math.atan2(mt,px),
    bd=1+.38*(fbm(Math.cos(ang)*1.6+5,Math.sin(ang)*1.6+5)-.5)+.1*(nz(ang*9+2,4)-.5),q=rad/bd;
  F+=.14*Math.exp(-((q-1.3)**2)/.05);F-=.6*Math.exp(-((q-1)**2)/.04);if(mt>.6)F-=.15*Math.exp(-((q-1.15)**2)/.03);
  if(q<1)F=.012*smt(.4,1,q);
  return F}
function drawFace(g0,w,h){
  const k=1-scareT/scareDur,buf=new Float32Array(w*h);
  const near=k>.45,S=Math.min(w*1.25,h*.75)*(near?1.25:.85),ox=w/2,oy=h*(near?.27:.33);
  const ag=0,ca=Math.cos(ag),sa=Math.sin(ag);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const u=(x-ox)/S,v=(y-oy)/S,n=fbm(u*60+40,v*60+40);
    let L=.03+(fbm(u*12,v*12)-.5)*.06;
    if(v>.4){const fz=(nz(u*60+1,v*60)-.5)*.09+(fbm(u*3+5,2)-.5)*.26,top=.5+.14*(u/.4)**2+.06*u+fz,sh=(.38+.12*smt(.5,1,v))*(1+.4*(fbm(v*3,u>0?4:9)-.5))+(nz(u*70,v*70)-.5)*.07;
      if(v>top&&Math.abs(u)<sh){const e=Math.min(.999,Math.abs(u)/sh);L=(.3+.62*Math.sqrt(1-e*e))*(1-.45*smt(.6,1.2,v))*(.85+.2*u/sh)+(nz(u*80,v*12)-.5)*.18;
        L-=.18*Math.exp(-((((v-top)-.06-.03*Math.abs(u))/.02)**2))*smt(.05,.25,Math.abs(u));L*=smt(1,.82,e)*smt(0,.04,v-top)}}
    const ncx=.025*Math.sin(v*6+1),nu=u-ncx,nw=(.13+.07*smt(.32,.6,v)+.2*smt(.5,.75,v))*(1+.5*(fbm(v*4+3,nu>0?2:6)-.5))+(nz(u*70+4,v*70)-.5)*.06+(nz(u*160+8,v*30)-.5)*.04;
    if(v>.12&&v<.8&&Math.abs(nu)<nw){const e=Math.abs(nu)/nw;L=(.32+.55*Math.sqrt(1-e*e))*(.85+.2*nu/nw)-.3*smt(.36,.24,v)+(nz(u*90,v*15)-.5)*.2;
      L-=.14*Math.exp(-(((Math.abs(nu)-nw*.5)/.016)**2))*smt(.3,.5,v);L*=smt(1,.75,e)}
    const tw=.028*(1-(v-.3)/.2);if(v>.3&&v<.5&&Math.abs(u-.015)<tw)L=.6+(nz(u*120,v*20)-.5)*.4;
    const dv=v-.3,hu=u*ca+dv*sa,hv=-u*sa+dv*ca+.3;
    for(const s of [-1,1]){const us=hu*s;if(us>.14){
      const ex=us-.32,ey=hv+.12-(us-.2)*(s<0?.28:.08),er=(ex/.17)**2+(ey/(.04+.025*smt(-.1,.15,ex)))**2-(nz(ex*60+s*9,ey*60)-.5)*.45;
      if(er<1){L=(s>0?.85:.42)*(.45+.55*Math.sqrt(1-er));if((ex/.13)**2+((ey-.004)/.025)**2<1)L*=.7;L+=(n-.5)*.15}}}
    for(const s of [-1,1]){const hd=((hu-s*.1)/.035)**2+((hv+.4)/.05)**2;if(hd<1)L=.78*(1-.3*hd)}
    let hw;
    if(hv<-.12)hw=.26*Math.sqrt(Math.max(0,1-((hv+.12)/.3)**2));
    else{hw=.26-(near?.07:.14)*smt(-.12,.26,hv);const ext=near?.42:.09;if(hv>.24)hw*=Math.sqrt(Math.max(0,1-((hv-.24)/ext)**2))}
    if(hw>0){hw*=(1+.16*Math.exp(-(((hv+.1)/.1)**2)))*(1+.42*(fbm(hv*3+1,hu>0?3:8)-.5));hw+=(nz(hu*80+7,hv*80)-.5)*.06+(nz(hu*160+3,hv*30)-.5)*.04}

      const w8=now-needSince;
      if(w8>28000){badEnding('open')}
      else if(w8>15000){if(!flags.warnOpen){flags.warnOpen=1;say('…안 감을 거예요?')}}
      else if(now-lastSay>7000&&eyeT===0)say('눈을 감아요.\n화면을 꾹 누르고 있어요.')}
    else if(now-lastTap>9000&&now-idleSaid>12000){idleSaid=now;say(phase==='p2'?'자면 안 돼요.':'자요?');document.title='자요?';
}
  }
  if(holding&&(phase==='p1'||phase==='p2')&&now-holdStart>380)eyeT=1;
  if(forceClose)eyeT=1;else if(phase!=='p1'&&phase!=='p2'){eyeT=0}
  eyeC+=(eyeT-eyeC)*Math.min(1,dt*7);
  $('hint').style.display=needClose&&eyeT===0&&(phase==='p1'||phase==='p2')?'block':'none';
  whisper(eyeC>.95&&closedT>.5&&scareT<=0);
  if(eyeC>.95){closedT+=dt;hoofT-=dt;if(hoofT<=0){clop();hoofT=.3+R0()*.55;if(R0()<.12)bleat(hum(),.035)}}
  if(!frozen)sheep.forEach(s=>{
    if(s.lost){s.t+=dt*.32;s.x+=s.dir*s.speed*dt*.35;return}
    if(s.stop)return;
    if(s.paused){s.pause-=dt;if(s.pause<=0)s.paused=false;return}
    const nx=s.x+s.dir*s.speed*dt;
    if(!s.counted&&(s.x-fx)*(nx-fx)<=0){
      if(s.kind==='stare'){s.x=fx;s.stop=true;tone(90,1,'sine',.1);say('…이 양은 안 넘어가네요.\n눌러서 보내주세요.');return}
      if(s.kind==='tall'&&!flags.tallSeen){flags.tallSeen=1;s.paused=true;s.pause=2.4;s.x=fx;say('저건 세지 마세요.');tone(55,2,'sawtooth',.06);return}
    }
    s.x=nx;s.leg+=dt*s.speed/3;
    if(s.counted&&!s.lchk&&s.kind==='normal'&&s.x>fx+6&&(phase==='p2'||count>=7)){s.lchk=1;if(R0()<.35&&lostN<7){s.gone=true;lostN++}}
  });
  sheep=sheep.filter(s=>{if(s.gone)return false;const out=s.dir>0?s.x>LW+24:s.x<-24;if(out&&!s.counted&&phase==='p2'&&s.kind!=='tall'&&!flags.missed){flags.missed=1;say('한 마리 놓쳤어요.\n…그 양은 어디로 갔을까요.')}return!out});
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.2);
  shake=Math.max(0,shake-dt);

  cx.save();
  if(shake>0)cx.translate(Math.round((R0()-.5)*5*shake),Math.round((R0()-.5)*5*shake));
  drawBG();
  if(lostShow.length)drawLost();
  if(watch&&watch<4)drawWatcher();
  sheep.forEach(s=>{if(s.lost){cx.save();cx.globalAlpha=clamp((1-s.t)*2.5,0,1);const sc=1-.62*s.t,b=gy-15*s.t;cx.translate(s.x,b);cx.scale(sc,sc);cx.translate(-s.x,-gy);drawSheep(s);cx.restore()}else drawSheep(s)});
  if(watch===4)drawWatcher();
  cx.textAlign='center';cx.font='10px DotGothic16, monospace';
  floats.forEach(f=>{const y=f.y-f.t*12;cx.fillStyle='#000';cx.fillText(f.txt,f.x+1,y+1);cx.fillStyle=isP2()?'#c01818':'#f4f4f0';cx.fillText(f.txt,f.x,y)});
  cx.restore();
  if(eyeC>.01){const hg=(LH/2/.8+2)*eyeC;cx.fillStyle='#000';
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(LW,0);cx.lineTo(LW,hg*.8);cx.quadraticCurveTo(LW/2,hg*1.3,0,hg*.8);cx.fill();
    cx.beginPath();cx.moveTo(0,LH);cx.lineTo(LW,LH);cx.lineTo(LW,LH-hg*.8);cx.quadraticCurveTo(LW/2,LH-hg*1.3,0,LH-hg*.8);cx.fill();
    const ra=eyeC>.95?clamp((closedT-1.2)/2.5,0,1)*(isP2()?.3:.2):0;
    if(ra>0){if(reflKey!==''+LH){reflImg=renderRefl();reflKey=''+LH}cx.globalAlpha=ra;cx.drawImage(reflImg,Math.round(Math.sin(T*.5)*1.5),0);cx.globalAlpha=1}}
  if(dark>.01){cx.fillStyle=`rgba(0,0,0,${Math.min(1,dark)})`;cx.fillRect(0,0,LW,LH)}
  if(isP2()&&R0()<.18){for(let i=0;i<1+R0()*3;i++){const y=R0()*LH|0,h=1+R0()*6|0;cx.drawImage(cv,0,y,LW,h,Math.round((R0()-.5)*10),y,LW,h)}}
  post();
  drawOut();
  if(scareT>0){scareT-=dt;renderScare()}else if(scr.style.display!=='none')scr.style.display='none';
}
requestAnimationFrame(loop);
}
</script>
